# =====================================================================
# PRM POLSER — Stack: Directus (PostgreSQL) + Cloudflare Tunnel
# Infra base (F1). n8n i Odoo es mantenen externs (s'integren per API).
# Publicació: el portal React PWA viu a Cloudflare Pages (fora del repo)
# i l'API Directus s'exposa per Cloudflare Tunnel (api.partners.polser.cat).
# Ús:  cp .env.example .env  ->  omplir  ->  docker compose up -d
# =====================================================================
name: prm-polser

services:

  directus:
    image: directus/directus:12.3.1
    container_name: polser-prm
    restart: unless-stopped
    environment:
      # Manu d'instància (Directus)
      KEY: "${DIRECTUS_KEY}"
      SECRET: "${DIRECTUS_SECRET}"
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD}"
      # Base de dades (PostgreSQL del PRM)
      DB_CLIENT: ${DB_CLIENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
# Publicació i CORS: Directus a l'arrel d'api.partners.polser.cat (via Tunnel);
      # el portal (partners.polser.cat, Cloudflare Pages) crida en cross-origin.
      PUBLIC_URL: "${PUBLIC_URL}"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      # SMTP (enviament d'emails, ex. codis OTP del login)
      EMAIL_FROM: "${EMAIL_FROM}"
      EMAIL_TRANSPORT: "${EMAIL_TRANSPORT:-smtp}"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-587}"
      EMAIL_SMTP_SECURE: "${EMAIL_SMTP_SECURE:-false}"
      EMAIL_SMTP_USER: "${EMAIL_SMTP_USER}"
      EMAIL_SMTP_PASSWORD: "${EMAIL_SMTP_PASSWORD}"
      # Extensions (F3 auth-otp). Recarrega automàticament al canviar ./extensions.
      EXTENSIONS_AUTO_RELOAD: "true"
    ports:
      # Només accés local (dev/admin). En producció NO s'exposa públicament:
      # l'únic accés extern és el túnel de cloudflared.
      - "10001:8055"
    volumes:
      - uploads:/directus/uploads
      - ./extensions:/directus/extensions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:10001/server/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# =====================================================================
# Estructura del repo
#   schema/   -> DDL + seed (migracions bàsiques)
#   portal/   -> app React PWA (build -> portal/dist, desplegada a Cloudflare Pages)
#   Caddyfile -> ja NO s'usa (substituït per Cloudflare Tunnel + Pages)
# =====================================================================

volumes:
  uploads:
